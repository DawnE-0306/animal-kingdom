<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal Kingdom</title>
  <link rel="icon" href="images/icon.jpg">
  <script src="script.js" defer></script>
  <link rel="stylesheet" href="animal-sounds.css">
</head>
<body>
  <div class="container">
    <h1 class="zoo1">🌿 Animal Kingdom</h1>
    <p class="zoo2">Discover the wonderful sounds of animals!</p>
    <h2>🐾 Animal Directory</h2>
    <div class="z003" id="animalName"></div>

    <div class="search-box">
      <h2>Find an Animal</h2>
      <p>Enter an animal number from 0 to 3.</p>
      <input class="zoo4" type="number" id="animalFinder">
      <button onclick="findAnimal()" class="z005">Submit</button>
    </div>
    <div id="result" class="zoo6"></div>

    <footer>
      <p>🌱 Animal Kingdom | Explore. Discover. Listen.</p>
    </footer>
  </div>
</body>
</html>
